[project]
name = "backend"
version = "0.1.0"
description = "Waitlist API — FastAPI backend"
readme = "README.md"
authors = [
    { name = "Blas Oliva", email = "blasoliva@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0.53",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.uv.build-backend]
module-name = "app"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
